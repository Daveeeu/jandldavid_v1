services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-jandldavid-hu:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://jandldavid.hu}
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/up >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 10

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-jandldavid-hu:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://jandldavid.hu}
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    networks:
      - default
      - traefik-public
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 20s
      timeout: 5s
      retries: 10

networks:
  traefik-public:
    external: true
